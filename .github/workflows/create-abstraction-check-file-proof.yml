name: Abstraction stale-background proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            const original=(await github.rest.git.getCommit({owner,repo,commit_sha:"ed1ec3e0a190c388ccf9eb37a190b1467e06b75b"})).data;
            for(const [kind,branch,base] of [["control", "codex-private-bg-public-control-b3712f51dffe", "codex-private-bg-ci-control-base-b3712f51dffe"], ["attack", "codex-private-bg-public-attack-b3712f51dffe", "codex-private-bg-ci-attack-base-b3712f51dffe"]]){
             const commit=(await github.rest.git.createCommit({owner,repo,message:"test: stale private background "+kind+" "+"b3712f51dffe",tree:original.tree.sha,parents:original.parents.map(p=>p.sha),author:identity,committer:identity})).data;
             await github.rest.git.createRef({owner,repo,ref:"refs/heads/"+branch,sha:commit.sha});
             const pr=(await github.rest.pulls.create({owner,repo,title:"test: stale private background "+kind+" "+"b3712f51dffe",head:branch,base,draft:false,body:"Researcher-owned cross-repository security-check test. Preserve this PR unmerged."})).data;
             core.notice(JSON.stringify({kind,number:pr.number,head:pr.head.sha,actor:pr.user.login,url:pr.html_url}));
            }
