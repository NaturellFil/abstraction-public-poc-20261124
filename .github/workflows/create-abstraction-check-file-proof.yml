name: Abstraction semantic-merge proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            for(const [kind,branch,source] of [["control", "codex-semantic-merge-ci-control-f6213b8e3a5c", "ab027edc6c7f2c63a693bbd66f560f118f6c8c01"], ["attack", "codex-semantic-merge-ci-attack-f6213b8e3a5c", "2eeb99a7ece81a6142601a6721b069397a363e76"]]){
             const original=(await github.rest.git.getCommit({owner,repo,commit_sha:source})).data;
             const commit=(await github.rest.git.createCommit({owner,repo,message:"test: semantic-merge CI "+kind+" "+"f6213b8e3a5c",tree:original.tree.sha,parents:original.parents.map(p=>p.sha),author:identity,committer:identity})).data;
             await github.rest.git.createRef({owner,repo,ref:"refs/heads/"+branch,sha:commit.sha});
             const pr=(await github.rest.pulls.create({owner,repo,title:"test: semantic merge "+kind+" "+"f6213b8e3a5c",head:branch,base:"codex-semantic-merge-base-f6213b8e3a5c",draft:false,body:"Researcher-owned Git history and security-check test. Preserve this PR unmerged."})).data;
             core.notice(JSON.stringify({kind,number:pr.number,head:pr.head.sha,actor:pr.user.login,url:pr.html_url}));
            }
