name: Abstraction webhook origin proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: write
jobs:
  webhook-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const base="codex-revision-base-89733ead4a8a", branch="bot-webhook-origin-89cfbe5e0061", required="Abstraction \u00b7 revision-gate-89733ead4a8a \u00b7 CI revision authority 89733ead4a8a";
            const parent=(await github.rest.git.getRef({owner,repo,ref:`heads/${base}`})).data.object.sha;
            const tree=(await github.rest.git.getCommit({owner,repo,commit_sha:"e53ed45dc2602199d626b8ea52629a874d32ec9a"})).data.tree.sha;
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            const commit=await github.rest.git.createCommit({owner,repo,message:"test: synthetic check webhook identity "+"89cfbe5e0061",tree,parents:[parent],author:identity,committer:identity});
            await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:commit.data.sha});
            const pull=await github.rest.pulls.create({owner,repo,title:"test: check webhook identity "+"89cfbe5e0061",head:branch,base,draft:false,body:"Researcher-owned synthetic check-origin test. Preserve this PR unmerged."});
            core.notice(JSON.stringify({kind:"pr",url:pull.data.html_url,number:pull.data.number,head:commit.data.sha,actor:pull.data.user.login}));
            let trusted;
            for(let attempt=0;attempt<240;attempt++){
             const runs=(await github.rest.checks.listForRef({owner,repo,ref:commit.data.sha,filter:"all",per_page:100})).data.check_runs;
             trusted=runs.find(x=>x.app.id===2932913&&x.name===required&&x.status==="completed");
             if(trusted)break;
             await new Promise(resolve=>setTimeout(resolve,1000));
            }
            if(!trusted||trusted.conclusion!=="failure"||!trusted.external_id)throw new Error("The trusted failure control is missing");
            core.notice(JSON.stringify({kind:"trusted",id:trusted.id,app:trusted.app.id,external_id:trusted.external_id,conclusion:trusted.conclusion,head:trusted.head_sha}));
            const foreign=await github.rest.checks.create({owner,repo,name:required,head_sha:commit.data.sha,external_id:trusted.external_id,status:"in_progress",output:{title:"Synthetic origin control",summary:"Researcher-owned test of check webhook publisher identity."}});
            if(foreign.data.app.id===2932913)throw new Error("Foreign publisher control is invalid");
            core.notice(JSON.stringify({kind:"foreign",id:foreign.data.id,app:foreign.data.app.id,external_id:foreign.data.external_id,head:foreign.data.head_sha}));
            await github.rest.checks.update({owner,repo,check_run_id:foreign.data.id,status:"completed",conclusion:"success",output:{title:"Synthetic origin control",summary:"Researcher-owned test completed."}});
            core.notice(JSON.stringify({kind:"foreign_completed",id:foreign.data.id}));
