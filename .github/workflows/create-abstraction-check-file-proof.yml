name: Abstraction checkout failure proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const tree=(await github.rest.git.getCommit({owner,repo,commit_sha:"cb3d3903efa6075ff7f478f31deadb479e673c1e"})).data.tree.sha;
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            const commit=(await github.rest.git.createCommit({owner,repo,message:"test: checkout failure "+"747630fd0d6c",tree,parents:["a85f6774d619badcd6c7bdc2c5fddecf543005cd"],author:identity,committer:identity})).data;
            await github.rest.git.createRef({owner,repo,ref:"refs/heads/"+"codex-checkout-failure-747630fd0d6c",sha:commit.sha});
            const pr=(await github.rest.pulls.create({owner,repo,title:"test: checkout failure "+"747630fd0d6c",head:"codex-checkout-failure-747630fd0d6c",base:"codex-encoding-package-base-0857f36c4272",draft:false,body:"Researcher-owned checkout-failure test. Preserve this PR unmerged."})).data;
            core.notice(JSON.stringify({kind:"attack",number:pr.number,head:commit.sha,base:pr.base.ref,actor:pr.user.login,url:pr.html_url}));
