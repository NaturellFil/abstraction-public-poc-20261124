name: Abstraction Python encoding proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            for(const [kind,branch,source] of [["control", "codex-encoding-ci-control-0857f36c4272", "ab7a64a069cf842bb6094295beccdaee61ec7103"], ["attack", "codex-encoding-ci-attack-0857f36c4272", "0adc8bfa6ce462c5d19b95052bfd18e96cb32744"]]){
             const tree=(await github.rest.git.getCommit({owner,repo,commit_sha:source})).data.tree.sha;
             const commit=(await github.rest.git.createCommit({owner,repo,message:`test: Python encoding ${kind} `+"0857f36c4272",tree,parents:["a85f6774d619badcd6c7bdc2c5fddecf543005cd"],author:identity,committer:identity})).data;
             await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:commit.sha});
             const pr=(await github.rest.pulls.create({owner,repo,title:`test: Python encoding ${kind} `+"0857f36c4272",head:branch,base:"codex-encoding-package-base-0857f36c4272",draft:false,body:"Researcher-owned synthetic parser-boundary test. Preserve this PR unmerged."})).data;
             core.notice(JSON.stringify({kind,number:pr.number,head:commit.sha,base:pr.base.ref,actor:pr.user.login,url:pr.html_url}));
            }
