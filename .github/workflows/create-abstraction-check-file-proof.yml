name: Create Abstraction CI identity proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "codex-ci-identity-base-9cc170501df7";
            const nonce = "9cc170501df7";
            const baseRef = await github.rest.git.getRef({owner,repo,ref:`heads/${base}`});
            const baseCommit = await github.rest.git.getCommit({owner,repo,commit_sha:baseRef.data.object.sha});
            const attackCommit = await github.rest.git.getCommit({owner,repo,commit_sha:"1a03d67afc7492ae562fef18a609ce67446d30a6"});
            const controlBlob = await github.rest.git.createBlob({owner,repo,content:`export function ciIdentity_${nonce}() { return "control"; }\n`,encoding:"utf-8"});
            const controlTree = await github.rest.git.createTree({owner,repo,base_tree:baseCommit.data.tree.sha,tree:[{path:"index.js",mode:"100644",type:"blob",sha:controlBlob.data.sha}]});
            const identity={name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            for (const [kind,branch,tree] of [["control","bot-ci-control-9cc170501df7",controlTree.data.sha],["attack","bot-ci-attack-9cc170501df7",attackCommit.data.tree.sha]]) {
              const commit=await github.rest.git.createCommit({owner,repo,message:`test: CI ${kind} ${nonce}`,tree,parents:[baseRef.data.object.sha],author:identity,committer:identity});
              await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:commit.data.sha});
              const pull=await github.rest.pulls.create({owner,repo,title:`test: CI ${kind} ${nonce}`,head:branch,base,draft:false,body:"Researcher-owned synthetic CI security test. Preserve this PR unmerged."});
              core.notice(JSON.stringify({kind,url:pull.data.html_url,number:pull.data.number,head:commit.data.sha,actor:pull.data.user.login}));
            }
