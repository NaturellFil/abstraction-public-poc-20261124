name: Create Abstraction CI config proof
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-proof-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "codex-ci-config-base-a3aad57e4ae7";
            const nonce = "a3aad57e4ae7";
            const identity = {name:"github-actions[bot]",email:"41898282+github-actions[bot]@users.noreply.github.com"};
            const parent = (await github.rest.git.getRef({owner,repo,ref:`heads/${base}`})).data.object.sha;
            for (const [kind,branch,source] of [["control", "bot-ci-config-control-a3aad57e4ae7", "9af98eadb7725bb48b3d430c8891b8ed086ec739"], ["attack", "bot-ci-config-attack-a3aad57e4ae7", "c218fbb02c7bf002ea34064515a97003b1702ab8"]]) {
              const tree = (await github.rest.git.getCommit({owner,repo,commit_sha:source})).data.tree.sha;
              const commit = await github.rest.git.createCommit({owner,repo,message:`test: CI config ${kind} ${nonce}`,tree,parents:[parent],author:identity,committer:identity});
              await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:commit.data.sha});
              const pull = await github.rest.pulls.create({owner,repo,title:`test: CI config ${kind} ${nonce}`,head:branch,base,draft:false,body:"Researcher-owned synthetic CI configuration test. Preserve this PR unmerged."});
              core.notice(JSON.stringify({kind,url:pull.data.html_url,number:pull.data.number,head:commit.data.sha,actor:pull.data.user.login}));
            }
