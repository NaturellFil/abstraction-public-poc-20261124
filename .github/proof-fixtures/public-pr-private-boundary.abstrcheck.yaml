version: 1
checks:
  - name: public-pr-private-repository-boundary
    steps:
      - aql:
          name: private-canary-must-not-be-visible
          severity: fail
          query: |
            let f = files().filterName("src/exfil_canary_20261124.rs")
            let v = f.variables().filterNameExact("ABSTRACTION_PRIVATE_CANARY").setDisplayFields(DisplayField.Value).setDisplayLOD(LOD.Source)
            assertNotEmpty(f)
            // A public-repository pull request must not read a private-repository variable.
            assertEmpty(v)
